<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f3d" />
      <stop offset="60%" stop-color="#1a365d" />
      <stop offset="100%" stop-color="#d81159" />
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d81159" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffbe0b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4cc9f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0a1f3d" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Flight Icon Badge -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Outer ring / globe arc -->
    <circle cx="34" cy="34" r="32" fill="url(#badgeGrad)" />
    <circle cx="34" cy="34" r="30" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" fill="none" />
    
    <!-- Dynamic orbital flight trail -->
    <path d="M 12 50 C 16 26, 38 14, 56 22" stroke="url(#trailGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 18 56 C 24 38, 42 28, 58 32" stroke="#4cc9f0" stroke-width="1.8" stroke-dasharray="2 3" stroke-linecap="round" fill="none" opacity="0.8" />
    
    <!-- Soaring Jet Plane -->
    <g transform="translate(32, 32) rotate(-42) scale(1.15)">
      <!-- Jet Fuselage -->
      <path d="M 0 -20 C 2.5 -12, 3 -2, 3 14 L 0 16 L -3 14 C -3 -2, -2.5 -12, 0 -20 Z" fill="#ffffff" />
      <!-- Wings -->
      <path d="M 0 -4 L 18 8 L 18 11 L 3 7 L 0 7 L -3 7 L -18 11 L -18 8 Z" fill="#ffffff" />
      <!-- Jet Engine Accents -->
      <rect x="6" y="7" width="2" height="4" rx="1" fill="#4cc9f0" />
      <rect x="-8" y="7" width="2" height="4" rx="1" fill="#4cc9f0" />
      <!-- Tail fin -->
      <path d="M 0 10 L 6 17 L -6 17 Z" fill="#4cc9f0" />
      <path d="M 0 8 L 1.5 16 L -1.5 16 Z" fill="#d81159" />
      <!-- Nose cockpit window -->
      <circle cx="0" cy="-14" r="1.2" fill="#0a1f3d" />
    </g>

    <!-- Star / spark accent -->
    <path d="M 52 14 L 53.5 17.5 L 57 19 L 53.5 20.5 L 52 24 L 50.5 20.5 L 47 19 L 50.5 17.5 Z" fill="#ffbe0b" />
  </g>

  <!-- Typography -->
  <g transform="translate(84, 0)">
    <!-- Brand Name -->
    <text x="0" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#0a1f3d">cheap</tspan><tspan fill="#d81159">trip</tspan><tspan fill="#0096c7">today</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="64" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="800" fill="#64748b" letter-spacing="2.8">
      FLIGHT DEALS &amp; TRAVEL
    </text>

    <!-- Decorative small accent bar -->
    <rect x="2" y="70" width="135" height="2" rx="1" fill="url(#trailGrad)" />
  </g>
</svg>